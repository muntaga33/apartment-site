<!DOCTYPE html>
<html>
<head>
<title>Contact - Muntaga's Property Hub</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f7fa;
color:#0f172a;
}

.nav{
background:#0f172a;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.nav a{
color:white;
text-decoration:none;
margin-left:18px;
font-size:14px;
}

.container{
max-width:800px;
margin:40px auto;
background:white;
padding:30px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

input, textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.success{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:8px;
margin-bottom:15px;
}

.footer{
margin-top:50px;
background:#0f172a;
color:white;
text-align:center;
padding:25px;
}
</style>
</head>

<body>

<div class="nav">
<div><strong>Muntaga's Property Hub</strong></div>

<div>
<a href="/">Home</a>
<a href="/about/">About</a>
<a href="/contact/">Contact</a>
</div>
</div>

<div class="container">

<h1>Contact Us</h1>

<p>Send us your inquiry and include your phone number or email so we can get back to you.</p>

{% if success %}
<div class="success">
Thank you. Your message has been received.
</div>
{% endif %}

<form method="post">
{% csrf_token %}

<label>Name</label>
<input type="text" name="name" required>

<label>Phone or Email</label>
<input type="text" name="contact" required>

<label>Message</label>
<textarea name="message" rows="6" required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

<div class="footer">
<p>© Muntaga's Property Hub</p>
</div>

</body>
</html>
